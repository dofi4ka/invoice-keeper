openapi: 3.1.0
info:
  title: Invoice Keeper API
  description: 'Напоминания о регулярных платежах.


    Авторизация: `POST /api/v1/auth/login` возвращает токен и выставляет cookie. Для
    запросов из Swagger нажмите **Authorize** и вставьте токен.


    Права: обычный пользователь смотрит платежи, отмечает оплату и исправляет дату
    оплаты; создание/архивация платежей, пользователи, категории, вебхуки, бюджеты
    и аудит — только администратор.'
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Авторизация
      summary: Вход по логину и паролю
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Авторизация
      summary: Текущий пользователь
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - Авторизация
      summary: Завершение текущей сессии
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/v1/recurring-payments:
    get:
      tags:
      - Регулярные платежи
      summary: Список регулярных платежей
      operationId: list_invoices_api_v1_recurring_payments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          description: Только для администратора
          default: false
          title: Include Archived
        description: Только для администратора
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceListItem'
                title: Response List Invoices Api V1 Recurring Payments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Регулярные платежи
      summary: Создание регулярного платежа
      operationId: create_invoice_api_v1_recurring_payments_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{invoice_id}:
    get:
      tags:
      - Регулярные платежи
      summary: Регулярный платёж
      operationId: get_one_api_v1_recurring_payments__invoice_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Регулярные платежи
      summary: Изменение регулярного платежа
      operationId: update_invoice_api_v1_recurring_payments__invoice_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Регулярные платежи
      summary: Прекращение регулярного платежа и его напоминаний с сохранением истории
      operationId: archive_invoice_api_v1_recurring_payments__invoice_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{invoice_id}/occurrences:
    get:
      tags:
      - Регулярные платежи
      summary: Все периоды платежа (история и будущие)
      operationId: invoice_occurrences_api_v1_recurring_payments__invoice_id__occurrences_get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceOut'
                title: Response Invoice Occurrences Api V1 Recurring Payments  Invoice
                  Id  Occurrences Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences:
    get:
      tags:
      - Платежи (периоды)
      summary: Получение списка платежей, оплаченные и просроченные
      operationId: list_occurrences_api_v1_payment_occurrences_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - paid
              - overdue
              - soon
              - upcoming
              type: string
          - type: 'null'
          title: Status
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - RUB
              - USD
              - EUR
              type: string
          - type: 'null'
          title: Currency
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          title: Category Id
      - name: invoice_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Invoice Id
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          description: Только платежи, где я ответственный
          default: false
          title: Mine
        description: Только платежи, где я ответственный
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          default: 2000
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceOut'
                title: Response List Occurrences Api V1 Payment Occurrences Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{occurrence_id}:
    get:
      tags:
      - Платежи (периоды)
      summary: Получение конкретного платежа
      operationId: get_one_api_v1_payment_occurrences__occurrence_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Платежи (периоды)
      summary: Подтверждение или отмена оплаты, исправление фактической даты оплаты
      operationId: patch_occurrence_api_v1_payment_occurrences__occurrence_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrencePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{occurrence_id}/receipt:
    post:
      tags:
      - Платежи (периоды)
      summary: Загрузка чека
      operationId: upload_receipt_api_v1_payment_occurrences__occurrence_id__receipt_post
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_receipt_api_v1_payment_occurrences__occurrence_id__receipt_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Платежи (периоды)
      summary: Удаление чека
      operationId: delete_receipt_api_v1_payment_occurrences__occurrence_id__receipt_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Платежи (периоды)
      summary: Скачать чек
      operationId: download_receipt_api_v1_payment_occurrences__occurrence_id__receipt_get
      security:
      - HTTPBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/summary:
    get:
      tags:
      - Платежи (периоды)
      summary: Получение итоговых сумм платежей по валютам
      operationId: summary_api_v1_payments_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок оплаты с (включительно)
          title: Date From
        description: Срок оплаты с (включительно)
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок оплаты по (включительно); по умолчанию — сегодня
          title: Date To
        description: Срок оплаты по (включительно); по умолчанию — сегодня
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Mine
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - Пользователи
      summary: Получение списка пользователей
      description: Все пользователи (включая администратора) — нужен, чтобы назначать
        ответственных.
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Пользователи
      summary: Создание обычного пользователя
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/{user_id}:
    patch:
      tags:
      - Пользователи
      summary: Изменение пользователя
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Пользователи
      summary: Удаление пользователя
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories:
    get:
      tags:
      - Категории
      summary: Категории с тратами за последний месяц
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryWithSpend'
                type: array
                title: Response List Categories Api V1 Categories Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Категории
      summary: Создание категории
      operationId: create_category_api_v1_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/categories/{category_id}:
    patch:
      tags:
      - Категории
      summary: Изменение категории
      operationId: update_category_api_v1_categories__category_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Категории
      summary: Удаление категории (платежи остаются без категории)
      operationId: delete_category_api_v1_categories__category_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/webhooks/meta:
    get:
      tags:
      - Вебхуки
      summary: События и пример данных для шаблонов
      operationId: meta_api_v1_webhooks_meta_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMeta'
      security:
      - HTTPBearer: []
  /api/v1/webhooks/preview:
    post:
      tags:
      - Вебхуки
      summary: Предпросмотр тела по шаблону
      operationId: preview_api_v1_webhooks_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/webhooks:
    get:
      tags:
      - Вебхуки
      summary: Список вебхуков
      operationId: list_hooks_api_v1_webhooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WebhookOut'
                type: array
                title: Response List Hooks Api V1 Webhooks Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Вебхуки
      summary: Создание вебхука
      operationId: create_hook_api_v1_webhooks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/webhooks/{webhook_id}:
    put:
      tags:
      - Вебхуки
      summary: Изменение вебхука
      operationId: update_hook_api_v1_webhooks__webhook_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: integer
          title: Webhook Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Вебхуки
      summary: Удаление вебхука
      operationId: delete_hook_api_v1_webhooks__webhook_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: integer
          title: Webhook Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/webhooks/{webhook_id}/test:
    post:
      tags:
      - Вебхуки
      summary: Отправить тестовое событие
      operationId: test_hook_api_v1_webhooks__webhook_id__test_post
      security:
      - HTTPBearer: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: integer
          title: Webhook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications:
    get:
      tags:
      - Прочее
      summary: Последние уведомления
      operationId: notifications_api_v1_notifications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsOut'
        '422':
