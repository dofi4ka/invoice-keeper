# Server deployment behind Traefik (TLS is terminated by Cloudflare).
# Images are built and pushed by .github/workflows/docker-publish.yml to GHCR.
#
#   docker compose -f deploy.compose.yaml pull
#   docker compose -f deploy.compose.yaml up -d
#
# Requires the external "traefik" network and HOSTNAME / POSTGRES_PASSWORD in .env.
# Optional: IMAGE_REGISTRY (default ghcr.io/dofi4ka/invoice-keeper) and IMAGE_TAG (default latest)
# to pin a release, e.g. IMAGE_TAG=v1.2.3. For a private registry run
# `docker login ghcr.io -u <user> -p <token>` first.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: invoice
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/dofi4ka/invoice-keeper}/backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://invoice:${POSTGRES_PASSWORD}@db:5432/invoice
      DATA_DIR: /data
      PUBLIC_URL: https://${HOSTNAME:?set HOSTNAME in .env}
      COOKIE_SECURE: "true"
    volumes:
      - data:/data
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/dofi4ka/invoice-keeper}/frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.invoice-keeper.rule=Host(`${HOSTNAME}`)"
      - "traefik.http.services.invoice-keeper.loadbalancer.server.port=80"

volumes:
  db:
  data:

networks:
  internal:
  traefik:
    external: true
